# Refreshes docs/_data/records.json from the Humanities Commons (KC Works)
# community and commits any changes. GitHub Pages then rebuilds.
#
# DORMANT until you are ready: it only runs when triggered by hand
# (workflow_dispatch). To go fully live, uncomment the `schedule:` block —
# the community slug below is already set to the real one.
#
# NOTE: while docs/_data/records.json still holds the sample records, running
# this WILL overwrite them with whatever the community currently contains
# (0 records until deposits are accepted). Only enable once you have real,
# curated records — or you'll replace the demo with an empty archive.
name: Fetch archive records

on:
  workflow_dispatch:
  # Uncomment to refresh automatically once a day (03:17 UTC):
  # schedule:
  #   - cron: "17 3 * * *"

permissions:
  contents: write

env:
  BASE_URL: "https://works.hcommons.org"
  COMMUNITY: "lighting-design-archive"

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and normalise records
        run: |
          python3 scripts/fetch_records.py \
            --base-url "$BASE_URL" \
            --community "$COMMUNITY" \
            --out docs/_data/records.json

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain docs/_data/records.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/_data/records.json
            git commit -m "Update archive records from $COMMUNITY"
            git push
          else
            echo "No changes to records.json"
          fi
